<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUNSET PRESS — One photo in. A full key-art poster out.</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">SUNSET PRESS</div>
  <div class="tagline">One photo in. A full key-art poster out.</div>
</header>
<main class="layout">
  <section class="stage-col">
    <div class="preview-wrap" id="preview-wrap">
      <canvas id="preview" width="620" height="620"></canvas>
      <div class="focus-ring" id="focus-ring" style="display:none"></div>
    </div>
    <div class="size-tabs" id="size-tabs"></div>
    <div class="export-row">
      <button type="button" class="export-btn" id="export-one">Export PNG</button>
      <button type="button" class="export-btn ghost" id="export-all">Export all 3 sizes</button>
    </div>
  </section>
  <aside class="controls">
    <section class="card">
      <h2><span class="step">1</span> · YOUR PHOTO</h2>
      <button type="button" class="choose-btn" id="choose-photo">Choose a photo…</button>
      <input type="file" id="photo-file" accept="image/*" hidden>
      <div class="sample-row" id="sample-row"></div>
      <p class="hint">Or tap a sample. Photos never leave your machine.</p>
    </section>
    <section class="card">
      <h2><span class="step">2</span> · POSTER STYLE</h2>
      <div class="style-grid" id="style-grid"></div>
    </section>
    <section class="card">
      <h2><span class="step">3</span> · CAPTION</h2>
      <label class="field-label" for="caption-title">Title</label>
      <input class="field" id="caption-title" type="text" value="SUNSET HEIST" maxlength="24">
      <label class="field-label" for="caption-kicker">Kicker</label>
      <input class="field" id="caption-kicker" type="text" value="ONE LAST JOB." maxlength="32">
      <p class="hint">Drag on the preview to move the subject focus. The title and footer are laid out from the bottom up, so they never cover a face.</p>
    </section>
  </aside>
</main>
<script type="module" src="src/ui.js"></script>
</body>
</html>
